    <div id="titulo3" class="rotulo titulo">o osso se une<br />ao implante</div>
    <div id="titulo4" class="rotulo titulo">a prótese é <b>parafusada</b><br />nos implantes</div>
    <div id="assinatura" class="rotulo">dra. Helena Prado · cirurgiã-dentista · CRO-UF 00000</div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const FIM = 11.9667;
      // P3 e P4 em quadros exatos (184 e 277 de 30 q/s); os tempos de cada passo são os da v3/v5 (o som depende deles)
      const P2 = 2.6, P3 = 184 / 30, P4 = 277 / 30;
      // a arrumação do quadro (o passo 1 vai para o meio, a tira e o chão aparecem)
      const ARRUMA = 0.35, ARRUMADO = 0.95;
      // a linha do chão: todos os objetos pousam aqui e se refletem a partir daqui
      const CHAO = 1136;

      // ---------- quadros fixos de cada passo (câmera) ----------
      // passo 1: começa exatamente como a virada termina e mergulha devagar (a prótese cresce um pouco mais)
      tl.fromTo("#pecas1", { scale: 0.7, y: -95 }, { scale: 0.755, y: -96, duration: P2, ease: "power1.inOut" }, 0);
      tl.fromTo("#grupo-protese", { y: -70, scale: 1 }, { y: -74, scale: 1.025, duration: P2, ease: "power1.inOut" }, 0);
      // a arrumação: o passo 1 inteiro encolhe para 0,84 e desce 112,9 px a partir do topo; no fim do mergulho (2,6)
      // ele ocupa y ~485–1131 e x ~207–872 (a base continua no chão; ~80 px de respiro abaixo do título)
      tl.fromTo("#cena1", { y: 0, scale: 1 }, { y: 112.9, scale: 0.84, duration: ARRUMADO - ARRUMA, ease: "power2.inOut" }, ARRUMA);
      tl.to("#chao", { opacity: 1, duration: ARRUMADO - ARRUMA, ease: "power1.inOut" }, ARRUMA);
      // o reflexo no chão acende junto (liga em 0,35; força 0 → 0,3), e o piso acetinado com ele
      tl.set("#palco", { attr: { "data-reflexo": 1 } }, ARRUMA);
      tl.fromTo("#palco", { "--reflexo": 0 }, { "--reflexo": 0.3, duration: ARRUMADO - ARRUMA, ease: "sine.inOut" }, ARRUMA);
      tl.set("#cetim", { attr: { "data-on": 1 } }, ARRUMA);
      tl.to("#cetim", { opacity: 1, duration: 0.6, ease: "sine.inOut" }, ARRUMA);
      // a assinatura sai de baixo (0,28–0,43, antes de a tira 1 chegar ao lugar dela) e volta fixa no alto, acima do
      // título (y 182)
      tl.to("#assinatura", { opacity: 0, duration: 0.15, ease: "power1.in" }, 0.28);
      tl.set("#assinatura", { y: 182 - 1262 }, ARRUMA + 0.25);
      tl.to("#assinatura", { opacity: 0.8, duration: 0.2, ease: "power1.out" }, ARRUMADO - 0.2);
      // passo 2: o osso de perto (corte seco), escala 0,82: y ~584–1131, x 110–970 (folga de 110 px dos lados)
      tl.set("#pecas2", { scale: 0.82, y: -218.9 }, 0);
      // passo 3: as imagens do corte em escala 0,9 (o bloco fica em y 577–1131, x 220–851)
      tl.set("#enq3", { scale: 0.9, y: 24 }, 0);
      // passo 4: a mesma arcada do passo 2, agora com a prótese assentada (corte seco)
      tl.set("#pecas4", { scale: 0.82, y: -218.9 }, 0);

      // ---------- cortes entre passos ----------
      tl.set("#cena1", { opacity: 0 }, P2);
      tl.set("#cena2", { opacity: 1 }, P2);
      tl.set("#cena3", { opacity: 1 }, P3);
      tl.set("#cena2", { opacity: 0 }, P3 + 0.5);
      tl.set("#cena3", { opacity: 0 }, P4);
      tl.set("#anot3", { opacity: 0 }, P4);
      tl.set("#cena4", { opacity: 1 }, P4);

      // ---------- títulos: o antigo sai (0,12 s), o novo entra inteiro (0,2 s), sem deslizar ----------
      const sai = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.12, ease: "power1.in" }, t - 0.12);
      const entra = (sel, t) => tl.to(sel, { opacity: 1, duration: 0.2, ease: "power1.out" }, t);
      sai("#titulo1", P2);
      entra("#titulo2", P2);
      sai("#titulo2", P3);
      entra("#titulo3", P3);
      sai("#titulo3", P4);
      entra("#titulo4", P4);

      // ---------- as tiras do roteiro ----------
      // tira 1: aparece aos poucos um pouco abaixo do lugar e sobe 240 px até pousar levemente torta (0,32–0,95),
      // sem encostar na assinatura (que já sumiu quando a tira passa por y 1300) nem no osso (que ainda desce).
      // A linha já foi lida na folha da virada, então se reconhece rápido. Opacidade 0 em t=0: o 1º quadro não muda.
      tl.set("#tira1", { opacity: 0, y: 240, rotation: -2.5 }, 0);
      tl.to("#tira1", { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.32);
      tl.to("#tira1", { y: 0, rotation: -1.1, duration: ARRUMADO - 0.32, ease: "power3.out" }, 0.32);
      // troca no corte de cada passo: a antiga sai (corte seco no passo 2, junto com o objeto; 0,12 s nos outros),
      // a nova entra em 0,2 s e assenta com um leve giro, como um papel pousado
      const pousa = (sel, t, giro) => {
        tl.fromTo(sel, { opacity: 0, y: 14, rotation: giro + 1.4 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, t);
        tl.to(sel, { y: 0, rotation: giro, duration: 0.35, ease: "power2.out" }, t);
      };
      tl.set("#tira1", { opacity: 0 }, P2);
      pousa("#tira2", P2, 0.8);
      sai("#tira2", P3);
      // a tira 3 entra 0,25 s depois do título: primeiro o título, depois o plano de corte, depois a tira
      pousa("#tira3", P3 + 0.25, -0.7);
      sai("#tira3", P4);
      pousa("#tira4", P4, 0.9);

      // ---------- passo 3: o plano de corte e a linha-guia até a tira ----------
      tl.to("#lamina", { opacity: 1, duration: 0.06 }, P3);
      tl.to("#lamina", { opacity: 0, duration: 0.1 }, P3 + 0.4);
      const guia = document.querySelector("#guia");
      const COMP_GUIA = Math.hypot(453.6 - 398, 830 - 798) + (1215 - 830);
      guia.setAttribute("stroke-dasharray", String(COMP_GUIA));
      tl.set("#guia", { attr: { "stroke-dashoffset": COMP_GUIA } }, 0);
      tl.to("#ponto3", { attr: { opacity: 1 }, duration: 0.12, ease: "power1.out" }, P3 + 1.8);
      tl.to("#guia", { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, P3 + 1.8);
      // quando a linha chega ao papel (no tempo do antigo rótulo), a palavra acende com o halo branco da virada
      tl.to("#tira3 .halo", { opacity: 1, duration: 0.3, ease: "power1.out" }, P3 + 1.98);

      // ---------- máscaras, faixas de luz e reflexo: função pura do tempo ----------
      const cl = (v) => Math.max(0, Math.min(1, v));
      const sineIO = (p) => -(Math.cos(Math.PI * p) - 1) / 2;
      const quadIO = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
      const prog = (t, a, b, e) => e(cl((t - a) / (b - a)));
      const lerp = (a, b, p) => a + (b - a) * p;
      // gradiente a 104° (faixa inclinada 14°, a mesma inclinação da luz): posição ao longo da linha do gradiente
      const ANG = (104 * Math.PI) / 180;
      const SN = Math.sin(ANG), CS = Math.cos(ANG);
      const LG = 1080 * Math.abs(SN) + 1920 * Math.abs(CS);
      const proj = (x, y) => (x - 540) * SN - (y - 960) * CS + LG / 2;
      const mask = (el, css) => { el.style.webkitMaskImage = css; el.style.maskImage = css; };
      const pos = (el, x) => { el.style.transform = "translateX(" + x.toFixed(1) + "px) rotate(14deg)"; };
      const $ = (s) => document.querySelector(s);
      const faixa1a = $("#faixa1a"), faixa1b = $("#faixa1b"), faixa2 = $("#faixa2"), faixa4 = $("#faixa4");
      const limpo2 = $("#osso-limpo2"), fosco2 = $("#osso-fosco2"), tinta4 = $("#tinta4");
      const cena2 = $("#cena2"), cena3 = $("#cena3"), lamina = $("#lamina"), depois = $("#corte-depois"), frente = $("#frente");
      const F = 160; // largura da transição entre fosco e limpo (e entre sombra e luz)

      function render(t) {
        // passo 1: faixa suave varre as peças (0,20–2,50)
        const x1 = lerp(-420, 1500, prog(t, 0.2, 2.5, sineIO));
        pos(faixa1a, x1);
        pos(faixa1b, x1);

        // passo 2: o vidro limpo atravessa (2,90–3,90)
        const e2 = lerp(-200, 1280, prog(t, 2.9, 3.9, sineIO));
        const p2 = proj(e2, 1130);
        // o limpo fica por cima e some suave na faixa; o fosco, por baixo, só existe da faixa para a direita
        mask(limpo2, "linear-gradient(104deg, #000 " + (p2 - F / 2).toFixed(1) + "px, transparent " + (p2 + F / 2).toFixed(1) + "px)");
        mask(fosco2, "linear-gradient(104deg, transparent " + (p2 - F / 2 - 10).toFixed(1) + "px, #000 " + (p2 - F / 2).toFixed(1) + "px)");
        pos(faixa2, e2);

        // passo 3: o plano de corte desce de logo abaixo do título (y 450) até o chão (P3 → P3+0,5); acima dele já é o
        // passo 3, abaixo ainda é o passo 2 (acima de 450 não há objeto). Não passa atrás da assinatura nem do título.
        // O osso cresce na rosca (P3+0,6 → P3+1,8; em coordenadas da imagem do corte)
        const y3 = lerp(450, CHAO + 4, prog(t, P3, P3 + 0.5, sineIO));
        if (t >= P3 && t < P3 + 0.5) {
          mask(cena3, "linear-gradient(180deg, #000 " + y3.toFixed(1) + "px, transparent " + y3.toFixed(1) + "px)");
          mask(cena2, "linear-gradient(180deg, transparent " + y3.toFixed(1) + "px, #000 " + y3.toFixed(1) + "px)");
        } else {
          mask(cena3, "none");
          mask(cena2, "none");
        }
        lamina.style.transform = "translateY(" + (y3 - 32).toFixed(1) + "px)";
        const g = lerp(1225, 735, prog(t, P3 + 0.6, P3 + 1.8, quadIO));
        mask(depois, "linear-gradient(180deg, transparent " + (g - 35).toFixed(1) + "px, #000 " + (g + 35).toFixed(1) + "px)");
        frente.style.transform = "translateY(" + (g - 40).toFixed(1) + "px)";
        frente.style.opacity = String(0.9 * cl((t - (P3 + 0.6)) / 0.15) * (1 - cl((t - (P3 + 1.65)) / 0.15)));

        // passo 4: a faixa de luz revela a prótese assentada (P4+0,2 → P4+1,2)
        const e4 = lerp(-200, 1280, prog(t, P4 + 0.2, P4 + 1.2, sineIO));
        const p4 = proj(e4, 1130);
        mask(tinta4, "linear-gradient(104deg, transparent " + (p4 - F / 2).toFixed(1) + "px, #000 " + (p4 + F / 2).toFixed(1) + "px)");
        pos(faixa4, e4);
      }
      render(0);
      const relogio = { t: 0 };
      tl.to(relogio, { t: FIM, duration: FIM, ease: "none", onUpdate: () => render(relogio.t) }, 0);

      window.__timelines["s08-video-dela"] = tl;
    })();
  </script>
</template>
