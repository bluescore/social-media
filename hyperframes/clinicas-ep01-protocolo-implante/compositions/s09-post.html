  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // câmera: começa perto do celular (escala 1,8) e recua devagar até 1,15
      const PERTO = { x: -0.5, y: -82, scale: 1.8 };
      tl.set("#c-placa", PERTO, 0);
      tl.set("#c-helena", { x: -60, y: 40, scale: 1.25 }, 0);
      tl.to("#helena", { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.0);
      // o vídeo dela cobre a tela inteira no começo (em coordenadas da camada com escala 1,8)
      tl.set("#voo", { x: 240.5, y: 482, scale: 0.5556 }, 0);
      // LEVAR JUNTO: encolhe e pousa como o 1º post (tile 0 da grade: x 405,5, y 762, largura 88)
      tl.to("#voo", { x: 405.5, y: 762, scale: 0.0815, duration: 1.2, ease: "power2.inOut" }, 0);
      // recuo da câmera e da Helena (camadas em velocidades diferentes)
      tl.to("#c-placa", { x: 0, y: 0, scale: 1.15, duration: 2.1, ease: "power2.inOut" }, 1.3);
      tl.to("#c-helena", { x: 0, y: 0, scale: 1, duration: 2.1, ease: "power2.inOut" }, 1.3);
      // etiqueta da maquete
      tl.to("#etiqueta", { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.6);

      // ===== v3 (3,4 s em diante) =====
      // a fita de posts: cada linha recebe uma cópia da fila inteira (14 posts, 182 px entre eles):
      // 5 novos + o vídeo dela + os 8 antigos da grade
      const postVideo = document.createElement("div");
      postVideo.className = "post";
      const fotoVideo = document.querySelector("#voo").cloneNode(false);
      fotoVideo.removeAttribute("id");
      fotoVideo.removeAttribute("style");
      postVideo.appendChild(fotoVideo);
      const fila = [
        ...document.querySelectorAll("#molde-fita > .post"),
        postVideo,
        ...document.querySelectorAll("#tela-rec .grade > .post:not(#post-novo)"),
      ];
      document.querySelectorAll("#fita .tira").forEach((tira) => {
        fila.forEach((post) => tira.appendChild(post.cloneNode(true)));
      });
      // posição da fila na linha r depois de k posts novos: o vídeo dela (5º da fila) vai para o lugar k
      const PASSO = 182;
      const posFila = (k) => (r) => (k - 5 - 3 * r) * PASSO;
      tl.set("#fita .tira", { x: posFila(0) }, 0);
      // troca invisível: a grade de antes dá lugar à fita, com tudo no mesmo lugar
      tl.set("#fita", { opacity: 1 }, 3.4);
      tl.set("#tela-rec .grade", { opacity: 0 }, 3.4);
      tl.set("#voo", { opacity: 0 }, 3.4);

      // 3,40–4,60 a câmera avança de novo para o celular; a Helena acompanha em outra velocidade
      const AVANCO = { duration: 1.2, ease: "power2.inOut" };
      tl.to("#c-placa", { x: 0, y: 252, scale: 2.2, ...AVANCO }, 3.4);
      tl.to("#c-helena", { x: -40, y: 300, scale: 1.35, ...AVANCO }, 3.4);
      // a cópia da etiqueta assume no mesmo lugar (troca invisível)
      tl.set("#etiqueta-a", { opacity: 1 }, 3.4);
      tl.set("#etiqueta", { opacity: 0 }, 3.4);
      // a etiqueta sobe junto e a linha continua presa ao celular (as duas pontas andam com a câmera)
      tl.to("#etiqueta-a", { x: -20, y: -140, ...AVANCO }, 3.4);
      const linhaA = document.querySelector("#linha-a");
      const pontas = { x1: 60, y1: 96, x2: -96, y2: 330 };
      tl.to(
        pontas,
        {
          x1: 330,
          y1: 96,
          x2: 210,
          y2: 438,
          ...AVANCO,
          onUpdate: () => linhaA.setAttribute("d", `M ${pontas.x1} ${pontas.y1} L ${pontas.x2} ${pontas.y2}`),
        },
        3.4
      );
      // 3,50 troca suave do texto: "último post · agora" → "3 semanas depois"
      tl.to("#txt-antes", { opacity: 0, y: -12, duration: 0.16, ease: "power2.in" }, 3.5);
      tl.fromTo("#txt-depois", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" }, 3.66); // entra depois de o texto antigo sair (sem quadro com texto sobre texto)

      // 3,60 / 3,82 / 4,04 / 4,26 / 4,48 cinco posts novos entram no começo e empurram os outros
      [3.6, 3.82, 4.04, 4.26, 4.48].forEach((t, i) => {
        tl.to("#fita .tira", { x: posFila(i + 1), duration: 0.2, ease: "power2.inOut" }, t);
      });

      // contadores: um objeto anda de 0 ao número final e escreve o texto (formato pt-BR)
      const nSeg = document.querySelector("#n-seg");
      const nVis = document.querySelector("#n-vis");
      const seg = { v: 0 };
      const vis = { v: 0 };
      // 4,80 "+438 seguidores" salta e conta em 1,0 s
      tl.to("#etiqueta-seg", { opacity: 1, duration: 0.12, ease: "power1.out" }, 4.8);
      tl.fromTo("#linha-seg", { strokeDashoffset: 372 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 4.8);
      tl.fromTo("#etiqueta-seg .caixa", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 4.8);
      tl.to(seg, { v: 438, duration: 1.0, ease: "power2.out", onUpdate: () => (nSeg.textContent = "+" + Math.round(seg.v)) }, 4.8);
      // 5,10 "21,3 mil visualizações" salta e conta em 1,0 s
      tl.to("#etiqueta-vis", { opacity: 1, duration: 0.12, ease: "power1.out" }, 5.1);
      tl.fromTo("#linha-vis", { strokeDashoffset: 144 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, 5.1);
      tl.fromTo("#etiqueta-vis .caixa", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 5.1);
      tl.to(
        vis,
        {
          v: 21.3,
          duration: 1.0,
          ease: "power2.out",
          onUpdate: () => {
            const [inteiro, decimal] = (Math.round(vis.v * 10) / 10).toFixed(1).split(".");
            nVis.innerHTML = `${inteiro}<span class="sep">,</span>${decimal} mil`;
          },
        },
        5.1
      );
      // parado até 6,8
      tl.set({}, {}, 6.8);
      window.__timelines["s09-post"] = tl;
    })();
  </script>
