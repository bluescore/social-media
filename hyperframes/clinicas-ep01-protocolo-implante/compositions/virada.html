          if (t < 1.74) {
            const q = cl((t - 1.62) / 0.12);
            x = suave(8, margemX, q); y = suave(8, ys[0], q);
          } else {
            x = margemX; y = ys[0];
            for (let i = 1; i < alvos.length; i++) {
              const t1 = alvos[i].t - 0.2;
              if (t >= t1) y = suave(ys[i - 1], ys[i], cl((t - t1) / 0.2));
            }
          }
        }
        ponto.setAttribute("cx", String(x));
        ponto.setAttribute("cy", String(y));
        luzPonto.style.left = x + "px";
        luzPonto.style.top = y + "px";
      }
      renderFio(0);
      const relogio = { t: 0 };
      tl.to(relogio, { t: 8.8333, duration: 8.8333, ease: "none", onUpdate: () => renderFio(relogio.t) }, 0);
      // as palavras trocam de Regular chumbo para Bold laranja no instante em que o fio chega
      alvos.forEach((a) => {
        tl.to("#" + a.id + " .r", { opacity: 0, duration: 0.22, ease: "power1.out" }, a.t);
        tl.to("#" + a.id + " .b", { opacity: 1, duration: 0.22, ease: "power1.out" }, a.t);
        tl.to("#" + a.id + " .halo", { opacity: 1, duration: 0.3, ease: "power1.out" }, a.t - 0.04);
      });

      // ---- 5,03: a folha sai da maquete — sobe, endireita; a bancada desfoca e escurece (nunca abaixo de #2B2224)
      tl.to(".sombra-papel", { opacity: 0, duration: 0.4 }, 5.45);
      tl.to("#placa-desfocada", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, SOBE);
      tl.to("#escurecer", { opacity: 0.55, duration: 0.5, ease: "power2.inOut" }, SOBE);
      tl.to("#folha", { x: 0, y: 0, scale: 0.72, rotation: 0, duration: 0.5, ease: "power2.inOut" }, SOBE);
      tl.to(".sombra-papel", { boxShadow: "0 40px 80px rgba(20,12,10,0.55)", duration: 0.5 }, SOBE);

      // ---- dobras na batida: a lateral esquerda e depois a direita dobram para trás
      const D1 = 166 / 30, D2 = 191 / 30;
      tl.to("#aba-esq", { rotationY: -179.5, duration: 0.7, ease: "power2.inOut" }, D1);
      tl.to("#aba-esq .sombra-dobra", { opacity: 0.5, duration: 0.35, ease: "power1.in" }, D1);
      tl.to("#aba-dir", { rotationY: 179.5, duration: 0.7, ease: "power2.inOut" }, D2);
      tl.to("#aba-dir .sombra-dobra", { opacity: 0.5, duration: 0.35, ease: "power1.in" }, D2);
      // o cartão se inclina para o lado que dobra, como uma folha sendo manuseada, e volta reto antes do giro
      tl.to("#folha", { rotationY: 16, duration: 0.35, ease: "power2.out" }, D1);
      tl.to("#folha", { rotationY: 0, duration: 0.4, ease: "power2.inOut" }, D1 + 0.37);
      tl.to("#folha", { rotationY: -16, duration: 0.35, ease: "power2.out" }, D2);
      tl.to("#folha", { rotationY: 0, duration: 0.4, ease: "power2.inOut" }, D2 + 0.37);
      // o fio vira a moldura do cartão
      tl.to("#moldura-frente", { opacity: 1, duration: 0.25, ease: "power1.out" }, 6.95);
      tl.set("#moldura-verso", { opacity: 1 }, 6.95);

      // ---- giro de 180°: no verso, o estúdio a meia-luz (as laterais somem quando o cartão está de lado)
      tl.to("#folha", { rotationY: 180, duration: IMPACTO - 7.2, ease: "power3.in" }, 7.2);
      tl.set(["#aba-esq", "#aba-dir"], { opacity: 0 }, 7.86);

      // ---- IMPACTO: a luz do estúdio acende e o cartão vira a tela inteira
      tl.to("#meia-luz", { opacity: 0, duration: 0.14, ease: "power2.out" }, IMPACTO);
      tl.to("#folha", { scale: 1, duration: 0.8, ease: "power3.out" }, IMPACTO);
      tl.to("#verso", { borderRadius: 0, duration: 0.8, ease: "power3.out" }, IMPACTO);
      tl.to("#moldura-verso", { opacity: 0, borderRadius: 0, duration: 0.5, ease: "power2.out" }, IMPACTO + 0.2);
      tl.to("#escurecer", { opacity: 0.8, duration: 0.4 }, IMPACTO);

      // ---- o vídeo dela: título pousa; a câmera mergulha devagar; uma faixa de luz varre a peça
      tl.to("#titulo-video", { opacity: 1, duration: 0.25, ease: "power1.out" }, 8.45);
      // a peça fica parada aqui: a partir de 8,833 s o vídeo dela continua em compositions/s08-video-dela.html,
      // que começa exatamente neste estado (peças em escala 0,7 e y -95; prótese em y -70; título visível)
      tl.set("#pecas", { scale: 0.7, y: -95 }, 0);
      tl.set("#protese", { y: -70 }, 0);

      window.__timelines["virada"] = tl;
    })();
  </script>
</template>
