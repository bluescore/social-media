<!-- Cena 3 — a espera (3,0 s, do 5º compasso até o corte para o preto).

     fonte/corrigir-clipes.py, que também troca o desenho do botão para o mesmo do close: quadrado com o triângulo aceso).
     Usa o trecho de 1,9 a 4,9 s do clipe: o fim do olhar para cima e a espera parada. -->
<template>

    #root {
      position: absolute;
      inset: 0;

  <div data-hf-id="hf-p29x" id="root" data-composition-id="espera" data-width="1080" data-height="1920">

        class="clip"
