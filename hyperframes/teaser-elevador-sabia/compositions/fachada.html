      const batida = (n) => Math.round(BATIDAS[n] * 30) / 30;
      const T_ENTRA = batida(12); // 7,667 s: atravessa o vidro no início do 4º compasso
      const ZOOM_FINAL = 62; // no fim, um vidro da janela ocupa a tela inteira
      const DEVAGAR = 0.07;
      const MERGULHO = (Math.log(ZOOM_FINAL) - DEVAGAR * T_ENTRA) / Math.pow(T_ENTRA, 4);
      const BASE = 1080 / 3072; // fachada inteira cabendo na largura do vídeo
      const CENTRO = { x: 1536, y: 2752 }; // centro da fachada
      const ALVO = { x: 1534.6, y: 2404.8 }; // janela que fica acesa (fonte/janelas.json)
      const VIDRO = { x: 1573.1, y: 2404.4 }; // vidro da direita dessa janela: é por ele que a câmera entra

      const zoom = (t) => Math.exp(DEVAGAR * t + MERGULHO * Math.pow(t, 4));
      const suave = (x) => {
        const c = Math.min(Math.max(x, 0), 1);
        return c * c * (3 - 2 * c);
      };
      // estado da câmera no tempo t: zoom e o ponto do prédio que está no centro da tela
      function estado(t) {
        const z = zoom(t);
        // o ponto que fica no centro da tela vai do centro do prédio até a janela acesa
        // e, já bem perto, desliza para o centro do vidro da direita (para não entrar pelo caixilho)
        const p = suave(Math.log(z) / Math.log(3));
        const q = suave((Math.log(z) - Math.log(8)) / (Math.log(40) - Math.log(8)));
        const px = CENTRO.x + (ALVO.x - CENTRO.x) * p + (VIDRO.x - ALVO.x) * q;
        const py = CENTRO.y + (ALVO.y - CENTRO.y) * p + (VIDRO.y - ALVO.y) * q;
        return { s: BASE * z, px, py };
      }
      function camera(t) {
        const { s, px, py } = estado(t);
        gsap.set("#fachada-mundo", { x: 540 - s * px, y: 960 - s * py, scale: s, transformOrigin: "0 0" });
      }
      // tempo (s) em que o zoom atinge um valor, para amarrar outros eventos ao zoom
      function quandoZoom(alvo) {
        let a = 0,
          b = T_ENTRA;
        for (let i = 0; i < 40; i++) {
          const m = (a + b) / 2;
          if (zoom(m) < alvo) a = m;
          else b = m;
        }
        return (a + b) / 2;
      }

      const tl = gsap.timeline({ paused: true });
      const relogio = { t: 0 };
      camera(0);
      tl.to(relogio, { t: 7.7, duration: 7.7, ease: "none", onUpdate: () => camera(relogio.t) }, 0);

      // ---------- close da fachada ----------
      // entra quando já cobre a tela inteira (zoom ≥ 3,5) e a fachada aberta sai logo depois
      const tClose = quandoZoom(3.6);
      const tCloseFim = quandoZoom(4.6);
      tl.fromTo("#fachada-close", { opacity: 0 }, { opacity: 1, duration: tCloseFim - tClose, ease: "none" }, tClose);
      tl.set("#fachada-base, .janela", { opacity: 0 }, tCloseFim + 0.05);

      // ---------- janelas piscando ----------
      // como na referência: grupos de janelas acendem e apagam de uma vez, sempre na batida da trilha. Acompanham o
      // crescendo: começam poucas e calmas, ganham uma rajada no 2º compasso e vão sumindo até sobrar só a janela-alvo.
      const janelas = Array.from(document.querySelectorAll("#fachada-mundo .janela"));
      const alvo = janelas.findIndex((j) => j.dataset.alvo === "1");
      let semente = 16112026;
      const sorteio = () => {
        semente = (semente * 1664525 + 1013904223) % 4294967296;
        return semente / 4294967296;
      };
      // nenhuma janela acende atrás das letras enquanto o texto está na tela (o branco perde contraste no laranja)
      const AREAS_TEXTO = [
        { de: 1.0, ate: 4.1, x0: 360, y0: 400, x1: 1010, y1: 600 }, // "quando a forma de pensar evolui"
        { de: 4.0, ate: 6.5, x0: 70, y0: 1070, x1: 640, y1: 1310 }, // "a identidade acompanha"
      ];
      function naTela(el, t) {
        const { s, px, py } = estado(t);
        const wx = parseFloat(el.style.left), wy = parseFloat(el.style.top);
        const x0 = 540 + s * (wx - px), y0 = 960 + s * (wy - py);
        return [x0, y0, x0 + s * parseFloat(el.style.width), y0 + s * parseFloat(el.style.height)];
      }
      function atrasDoTexto(el, t) {
        // a janela tem que ficar livre durante todo o tempo em que fica acesa (até ~0,6 s depois): com o zoom ela
        // anda na tela, então confere a posição no começo e no fim desse tempo
        return [t, t + 0.6].some((tt) => {
          const [x0, y0, x1, y1] = naTela(el, tt);
          return AREAS_TEXTO.some((a) => t + 0.6 > a.de && t < a.ate && x1 > a.x0 && x0 < a.x1 && y1 > a.y0 && y0 < a.y1);
        });
      }
      function grupo(qtd, comAlvo, t) {
        const outras = janelas.map((_, i) => i).filter((i) => i !== alvo && !atrasDoTexto(janelas[i], t));
        for (let i = outras.length - 1; i > 0; i--) {
          const k = Math.floor(sorteio() * (i + 1));
          [outras[i], outras[k]] = [outras[k], outras[i]];
        }
        const g = new Set(outras.slice(0, comAlvo ? qtd - 1 : qtd));
        if (comAlvo) g.add(alvo);
        return g;
      }
      // [segundo, quantas janelas acesas, inclui a janela-alvo?]
      const ESTADOS = [
        [0.0, 6, true],
        [batida(1), 10, false],
        [batida(2), 16, true],
        [batida(3), 8, false],
        [batida(4), 30, true], // rajada no início do 2º compasso
        [batida(4) + 0.15, 34, true], // rajada (semicolcheia depois)
        [batida(5), 12, true],
        [batida(6), 20, true],
        [batida(6) + 0.3, 9, true],
        [batida(7), 6, true], // começam a sumir
        [batida(7) + 0.3, 3, true],
        [batida(8), 1, true], // início do 3º compasso: só a janela-alvo
      ];
      let anterior = new Set();
      for (const [t, qtd, comAlvo] of ESTADOS) {
        const agora = qtd === 1 ? new Set([alvo]) : grupo(qtd, comAlvo, t);
        janelas.forEach((el, i) => {
          if (agora.has(i) !== anterior.has(i)) tl.set(el, { opacity: agora.has(i) ? 1 : 0 }, t);
        });
        anterior = agora;
      }

      // ---------- letterings ----------
      // direita: palavra por palavra saindo do desfoque, a partir da batida 1; o destaque "evolui" cai na batida 2
      tl.fromTo(
        "#letreiro-direita .palavra",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out", stagger: 0.12 },
        batida(1),
      );
      tl.to("#letreiro-direita .palavra", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.02 }, batida(6) - 0.3);
      // esquerda: "a identidade" na batida 6 e "acompanha" na batida 7
      const esq = document.querySelectorAll("#letreiro-esquerda .palavra");
      tl.fromTo(
        [esq[0], esq[1]],
        { opacity: 0, filter: "blur(14px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.06 },
        batida(6),
      );
      tl.fromTo(esq[2], { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, batida(7));
      tl.to("#letreiro-esquerda .palavra", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, batida(10) - 0.3);

      window.__timelines["fachada"] = tl;
    })();
  </script>
</template>
