<!-- Passagem pela janela (sobreposta ao fim da fachada e ao começo do detalhe do botão).
     A luz laranja da cortina cresce até tomar a tela (no respiro da música) e se abre no impacto (7,235 s).
     É luz, não cartão de cor: mistura "screen" (só clareia), degradê suave que cresce devagar, e saída rápida
     para não deixar um filtro laranja por cima da mão. Cores da paleta Sabiá. -->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* cheia: tampa a tela por inteiro até o impacto (esconde o corte da fachada para o botão) */
    #passagem-cheia {
      position: absolute;
      inset: -10%;
      opacity: 0;
      background: radial-gradient(ellipse 75% 60% at 50% 48%, #f35c05 0%, #f34500 65%, #c93800 100%);
    }
    /* luz: no impacto troca a cheia e se abre como luz (só clareia), sem deixar filtro laranja */
    #passagem-luz {
      position: absolute;
      inset: -10%;
      opacity: 0;
      mix-blend-mode: screen;
      background: radial-gradient(ellipse 75% 60% at 50% 48%, #f35c05 0%, #f34500 65%, #c93800 100%);
    }
  </style>
  <div data-hf-id="hf-tgks" id="root" data-composition-id="passagem" data-width="1080" data-height="1920">
    <div data-hf-id="hf-s3vb" id="passagem-cheia"></div>
    <div data-hf-id="hf-vytq" id="passagem-luz"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // cresce junto com o mergulho e fica opaca (6,85 → 7,15 s do filme); no impacto (0,6333 s = quadro 217 = 7,2333 s)
      // a cheia sai de uma vez e a luz "screen" se abre sobre o botão
      const IMPACTO = 0.6333;
      // fica 100% opaca antes de o botão entrar por baixo (0,49 s, 1 quadro antes), para ele não aparecer antes da hora
      tl.fromTo("#passagem-cheia", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1.04, duration: 0.3, ease: "power2.in" }, 0.19);
      tl.to("#passagem-cheia", { scale: 1.08, duration: IMPACTO - 0.49, ease: "none" }, 0.49);
      tl.set("#passagem-cheia", { opacity: 0 }, IMPACTO);
      tl.set("#passagem-luz", { opacity: 1, scale: 1.08 }, IMPACTO);
      tl.to("#passagem-luz", { opacity: 0, scale: 1.2, duration: 0.26, ease: "power2.out" }, IMPACTO + 0.001);
      window.__timelines["passagem"] = tl;
    })();
  </script>
</template>
