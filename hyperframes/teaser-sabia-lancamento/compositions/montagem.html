<!-- MONTAGEM "teaser-sabia-lancamento" (9 s): ritmo copiado do brutos\...\exemplo.mp4.
     A tela tem duas faixas, em cima e embaixo. A cada batida de 0,3 s só uma delas troca:
     a foto nova entra pela METADE (data-entra = "cima" ou "baixo", até a linha data-corte, em px)
     e, na batida seguinte, ocupa a tela INTEIRA. Corte seco, sem transição.

     Para trocar uma foto: troque o src. Para mudar o enquadramento: mude o object-position dela no <style>.
     Para mudar o ritmo: mude data-start/data-duration (cada foto = 0,9 s: meia, inteira, meia coberta). -->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #1e1415; /* fundo escuro da marca (nunca aparece: as fotos cobrem tudo) */
    }
    .camada {
      position: absolute;
      inset: 0;
    }
    .foto {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
    }
    /* Fotos deitadas (paisagem) ficam só numa faixa, nunca na tela inteira */
    .painel-cima .foto {
      height: 960px;
    }
    .painel-baixo .foto {
      top: 960px;
      height: 960px;
    }

    /* Enquadramento de cada foto (horizontal vertical) */
    #m-01 .foto { object-position: 75% 50%; }
    #m-02 .foto { object-position: 40% 50%; }
    #m-03 .foto { object-position: 75% 50%; }
    #m-05 .foto { object-position: 60% 50%; }
    #m-06 .foto { object-position: 75% 50%; }
    #m-07 .foto { object-position: 35% 50%; }
    #m-09 .foto { object-position: 50% 50%; }
    #m-10 .foto { object-position: 50% 50%; }
    #m-11 .foto { object-position: 45% 50%; }
    #m-12 .foto { object-position: 80% 50%; }
    #m-13 .foto { object-position: 45% 50%; }
  </style>

  <div data-hf-id="hf-az9f" id="root" data-composition-id="montagem" data-width="1080" data-height="1920">
    <!-- 0,0 s: abre com o sabiá de verdade (é a capa do vídeo) -->
    <div data-hf-id="hf-d1yc" id="m-01" class="clip camada" data-start="0" data-duration="0.6" data-track-index="0" style="z-index: 1">
      <img data-hf-id="hf-iwp9" class="foto" src="assets/fotos/01-sabia-tordo.jpg" alt="Sabiá-laranjeira">
    </div>
    <div data-hf-id="hf-379r" id="m-02" class="clip camada" data-start="0.3" data-duration="0.9" data-entra="cima" data-corte="960" data-track-index="1" style="z-index: 2">
      <img data-hf-id="hf-82bx" class="foto" src="assets/fotos/02-post-its.jpg" alt="Mãos colando post-its na parede">

      <img data-hf-id="hf-r1mt" class="foto" src="assets/fotos/06-sabia-musgo.jpg" alt="Sabiá no galho com musgo">
    </div>
    <div data-hf-id="hf-mms0" id="m-07" class="clip camada" data-start="3.3" data-duration="0.9" data-entra="cima" data-corte="880" data-track-index="0" style="z-index: 7">
      <img data-hf-id="hf-7hte" class="foto" src="assets/fotos/07-maos-notebook.jpg" alt="Mãos no notebook">

      <img data-hf-id="hf-28x1" class="foto" src="assets/fotos/13-sabia-tronco.jpg" alt="Sabiá no tronco">
    </div>
    <!-- 6,9 s: entra o logo; de 7,2 s até o fim ele fica na tela, aproximando devagar -->
    <div data-hf-id="hf-17ay" id="m-14" class="clip camada" data-start="6.9" data-duration="2.1" data-entra="baixo" data-corte="960" data-track-index="1" style="z-index: 14">
      <img data-hf-id="hf-u3qz" class="foto" src="assets/fotos/14-logo-sabia-laranja.png" alt="Logo sabiá vertical no fundo laranja">
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const BATIDA = 0.3; // 9 quadros a 30 fps, igual ao vídeo de referência
    const INTEIRA = "inset(0px 0px 0px 0px)";

    // Cada foto com data-entra aparece só numa faixa por uma batida e depois ocupa a tela toda.
    document.querySelectorAll(".camada[data-entra]").forEach((camada) => {
      const foto = camada.querySelector(".foto");
      const inicio = parseFloat(camada.dataset.start);
      const corte = parseFloat(camada.dataset.corte);
      const metade =
        camada.dataset.entra === "cima"
          ? `inset(0px 0px ${1920 - corte}px 0px)` // mostra de 0 até a linha
          : `inset(${corte}px 0px 0px 0px)`; // mostra da linha até o fim
      tl.fromTo(foto, { clipPath: metade }, { clipPath: INTEIRA, duration: 0, immediateRender: true }, inicio + BATIDA);
    });

    // Logo final: aproxima 4% bem devagar enquanto fica na tela
    tl.fromTo("#m-14 .foto", { scale: 1 }, { scale: 1.04, duration: 1.8, ease: "power1.out" }, 7.2);

    window.__timelines["montagem"] = tl;
  </script>
</template>
